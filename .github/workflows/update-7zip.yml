name: Update 7-Zip

on:
  # Every day at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# The logic lives in .github/scripts, so it can also be run by hand. Each step runs a script and
# turns the object it returns into step outputs.
jobs:
  # Find the latest 7-Zip release, and whether the branch the workflow runs on already bundles it.
  # A scheduled run uses the default branch; a manual run uses the branch it was started from.
  # Runs from the 1.x branches (support/1.x, hotfix/1* and release/1*) are refused.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      update-needed: ${{ steps.check.outputs.update-needed }}
    steps:
      - name: Check out the workflow scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Compare the latest 7-Zip release with the current branch
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $status = ./.github/scripts/Get-7zipUpdateStatus.ps1 -Repository $env:GITHUB_REPOSITORY -Branch $env:BRANCH

          "version=$($status.Version)" >> $env:GITHUB_OUTPUT
          "update-needed=$($status.UpdateNeeded.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  # Update each product line on its own, with one issue and one pull request per line
  update-line:
    needs: check-version
    if: needs.check-version.outputs.update-needed == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: 1.x
            fallback-branch: support/1.x
          # The branch the workflow runs on; check-version refuses 1.x branches
          - line: 2.x
            fallback-branch: ${{ github.ref_name }}
    steps:
      - name: Check out the workflow scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # Hotfix branches first, then release branches, then the line's fallback branch.
      # When there is more than one hotfix or release branch, the highest version wins.
      - name: Find the target branch for ${{ matrix.line }}
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          LINE: ${{ matrix.line }}
          FALLBACK_BRANCH: ${{ matrix.fallback-branch }}
        run: |
          $target = ./.github/scripts/Get-7zipTargetBranch.ps1 -Repository $env:GITHUB_REPOSITORY -Line $env:LINE -FallbackBranch $env:FALLBACK_BRANCH -Version $env:VERSION

          "branch=$($target.Branch)" >> $env:GITHUB_OUTPUT
          "bundled-version=$($target.BundledVersion)" >> $env:GITHUB_OUTPUT
          "up-to-date=$($target.UpToDate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # The workflow's issue and pull request carry a hidden marker naming the line and version,
      # for example <!-- 7zip-update line=2.x version=26.06 -->. Only open items are considered.
      - name: Find the open issue and pull request for ${{ matrix.line }}
        id: existing
        if: steps.target.outputs.up-to-date == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          LINE: ${{ matrix.line }}
        run: |
          $existing = ./.github/scripts/Find-7zipUpdateItem.ps1 -Repository $env:GITHUB_REPOSITORY -Line $env:LINE -Version $env:VERSION

          "issue-number=$($existing.IssueNumber)" >> $env:GITHUB_OUTPUT
          "issue-version=$($existing.IssueVersion)" >> $env:GITHUB_OUTPUT
          "issue-action=$($existing.IssueAction)" >> $env:GITHUB_OUTPUT
          "pr-number=$($existing.PullRequestNumber)" >> $env:GITHUB_OUTPUT
          "pr-version=$($existing.PullRequestVersion)" >> $env:GITHUB_OUTPUT
          "pr-base=$($existing.PullRequestBase)" >> $env:GITHUB_OUTPUT
          "pr-action=$($existing.PullRequestAction)" >> $env:GITHUB_OUTPUT
          "nothing-to-do=$($existing.NothingToDo.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # Creates the issue, or moves an open one to the new version. When the open issue already
      # names the new version, it is left alone and only its number is passed on.
      - name: Create or update the issue for ${{ matrix.line }}
        id: issue
        if: steps.target.outputs.up-to-date == 'false' && steps.existing.outputs.nothing-to-do == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_7ZIP_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          LINE: ${{ matrix.line }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          BUNDLED_VERSION: ${{ steps.target.outputs.bundled-version }}
          ISSUE_ACTION: ${{ steps.existing.outputs.issue-action }}
          ISSUE_NUMBER: ${{ steps.existing.outputs.issue-number }}
          ISSUE_VERSION: ${{ steps.existing.outputs.issue-version }}
        run: |
          # Every step from here on writes with this token, so stop early when it is missing
          if (-not $env:GH_TOKEN) {
              throw 'The UPDATE_7ZIP_TOKEN secret is not set, so the issue and pull request cannot be created or updated.'
          }

          if ($env:ISSUE_ACTION -eq 'none') {
              Write-Host "Issue #$env:ISSUE_NUMBER already names 7-Zip Version $env:VERSION."
              "number=$env:ISSUE_NUMBER" >> $env:GITHUB_OUTPUT
              return
          }

          $arguments = @{
              Repository     = $env:GITHUB_REPOSITORY
              Line           = $env:LINE
              TargetBranch   = $env:TARGET_BRANCH
              BundledVersion = $env:BUNDLED_VERSION
              Version        = $env:VERSION
          }

          if ($env:ISSUE_ACTION -eq 'update') {
              $arguments.IssueNumber = $env:ISSUE_NUMBER
              $arguments.PreviousVersion = $env:ISSUE_VERSION
          }

          $issue = ./.github/scripts/Set-7zipUpdateIssue.ps1 @arguments

          "number=$($issue.Number)" >> $env:GITHUB_OUTPUT

      # The rest only runs when the pull request needs creating or moving to the new version.
      # Keep line endings as stored in the repository, so only real changes show up.
      - name: Disable line ending conversion
        if: steps.target.outputs.up-to-date == 'false' && steps.existing.outputs.pr-action != 'none'
        run: git config --global core.autocrlf false

      # Checked out with the update token, so the push in a later step is made by its account
      - name: Check out the target branch for ${{ matrix.line }}
        if: steps.target.outputs.up-to-date == 'false' && steps.existing.outputs.pr-action != 'none'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          path: target
          token: ${{ secrets.UPDATE_7ZIP_TOKEN }}

      # Creates or resets update-7zip-<line> from the target branch, and runs that branch's own
      # Update-7zipVersion.ps1. The changes are staged, not committed.
      - name: Update 7-Zip on the work branch for ${{ matrix.line }}
        id: update
        if: steps.target.outputs.up-to-date == 'false' && steps.existing.outputs.pr-action != 'none'
        shell: pwsh
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          LINE: ${{ matrix.line }}
        run: |
          $update = ./.github/scripts/Update-7zipWorkBranch.ps1 -Path target -Line $env:LINE -Version $env:VERSION

          "work-branch=$($update.WorkBranch)" >> $env:GITHUB_OUTPUT
          "changed=$($update.Changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "changed-files=$(ConvertTo-Json -InputObject @($update.ChangedFiles) -Compress)" >> $env:GITHUB_OUTPUT
